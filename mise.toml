# Tool versions. Node and pnpm are read from the root package.json
# (`devEngines.runtime` and `packageManager`), Rust from rust-toolchain.toml
# (which rustup reads too): each version lives in one place. The Docker
# image builds nothing (see the Dockerfile).
[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm", "rust"]

[tools]
watchexec = "2.8.0" # backend hot reload (dev:backend)
zig = "0.15.2" # musl cross-compile (cargo zigbuild): C code for ring/SQLite and static linking
"github:rust-cross/cargo-zigbuild" = "0.24.0" # builds the static release binaries via zig cc (scripts/build-linux.sh)
"aqua:google/osv-scanner" = "2.7.0" # known vulnerabilities in the lockfiles (mise run audit)
"aqua:aquasecurity/trivy" = "0.76.1" # known vulnerabilities in the image (mise run audit:image)

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------

# The Rust backend on :8000 (with the Vite proxy in front of the frontend
# for /api), and the frontend dev server.
[tasks.dev]
description = "Run dev mode"
depends = ["dev:backend", "dev:frontend"]

# Restarted when its code changes.
[tasks."dev:backend"]
description = "Run and watch for changes for the backend"
depends = ["ensure:dist"]
run = "watchexec --restart --stop-signal SIGINT --watch src --watch api --watch Cargo.toml --watch Cargo.lock --exts rs,toml,sql --ignore '**/target/**' -- cargo run"
dir = "packages/backend"

[tasks."dev:frontend"]
description = "Run the frontend dev server"
depends = ["gen:sdk"]
run = "pnpm run dev"
dir = "packages/frontend"

# Run the server against a built frontend. Depends on the build so a stale
# binary can never serve yesterday's code.
[tasks.start]
description = "Build the release binary and run it"
depends = ["build"]
run = "../../dist/potoo"
dir = "packages/backend"

# Tasks with sources and outputs are skipped when the outputs are newer
# than the sources.
#
# The JavaScript workspace (frontend, SDK, end-to-end tests). Every frontend
# task depends on this, so a fresh checkout (CI included) works; pnpm
# installs frozen when CI is set.
[tasks."install:frontend"]
description = "Install the JavaScript workspace (frontend, SDK and e2e) from the root lockfile"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "packages/*/package.json"]
outputs = ["node_modules/.pnpm/lock.yaml"]

# ---------------------------------------------------------------------------
# Generated code
# ---------------------------------------------------------------------------

[tasks."gen:spec"]
description = "Generate the OpenAPI spec from the backend"
dir = "packages/backend"
run = "cargo run --package api --bin specs"
# Skip regeneration while the sources are older than the generated specs.
sources = ["api/src/**/*.rs", "api/migrations/**/*", "**/Cargo.toml"]
outputs = ["target/specs/openapi.json", "target/specs/openapi.yaml"]

# The SDK the frontend calls the API with (packages/sdk/src), generated from
# the spec, never committed. One task, so that tasks running side by side
# never generate it twice at once.
[tasks."gen:sdk"]
description = "Regenerate the SDK (packages/sdk) from the OpenAPI spec"
depends = ["gen:spec", "install:frontend"]
run = "pnpm run openapi-ts"
sources = ["../backend/target/specs/openapi.json", "openapi-ts.config.ts"]
outputs = ["src/index.ts"]
dir = "packages/sdk"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

# The release binary for this machine, copied to dist/potoo out of the target
# directory, wherever cargo is configured to put it (cargo has no stable
# flag to put one artifact elsewhere).
[tasks.build]
description = "Build the release binary for this machine, with the frontend embedded, into dist/potoo"
depends = ["build:frontend"]
run = """
cargo build --release
mkdir -p ../../dist
cp "$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)/release/potoo" ../../dist/potoo
"""
sources = [
  "src/**/*",
  "api/src/**/*",
  "api/migrations/**/*",
  "**/Cargo.toml",
  "Cargo.lock",
  "../frontend/dist/**/*",
]
outputs = ["../../dist/potoo"]
dir = "packages/backend"

[tasks."build:frontend"]
description = "Build the frontend bundle into frontend/dist"
depends = ["gen:sdk"]
run = "pnpm run build"
sources = [
  "src/**/*",
  "index.html",
  "vite.config.ts",
  "tsconfig.json",
  "components.json",
  "package.json",
  "../sdk/src/**/*",
  "../../pnpm-lock.yaml",
]
dir = "packages/frontend"

# The static Linux binary (musl) the image copies, dist/potoo-linux-<arch>:
# built outside the image, with this machine's cargo cache. ARCH=amd64 or
# arm64 picks the architecture (default: this machine's).
# rust-embed fails to compile when packages/frontend/dist does not exist, but
# checks and tests never read the bundle, so an empty directory is enough:
# they need not wait for the frontend build. Release builds
# (build:linux) still depend on the real build:frontend.
[tasks."ensure:dist"]
description = "Make sure packages/frontend/dist exists (rust-embed needs the folder to compile)"
run = "mkdir -p packages/frontend/dist"

[tasks."build:linux"]
description = "Build the static (musl) Linux binary for this machine's CPU architecture into dist/, with the frontend embedded"
depends = ["build:frontend"]
run = "scripts/build-linux.sh"

# The image: Alpine and the binary above, for the architecture of this
# machine (ARCH=amd64 with --platform linux/amd64 builds the other one).
[tasks."build:docker"]
description = "Build the container image from the Linux binary in dist/ (for this machine's architecture)"
depends = ["build:linux"]
run = "podman build --format docker -t potoo ."

# The image with a CPU profiler: stop the container (SIGTERM) and the
# flamegraph is written to /data/flamegraph.svg. Never push this one.
[tasks."build:profiling"]
description = "Build a CPU-profiling image (never push it)"
depends = ["build:frontend"]
run = """
PROFILE=profiling FEATURES=profiling scripts/build-linux.sh
arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
podman build --format docker --build-arg BINARY=dist/potoo-linux-$arch-profiling -t potoo:profiling .
"""

# ---------------------------------------------------------------------------
# Checks and tests
# ---------------------------------------------------------------------------

[tasks.check]
description = "Run each stack's checks"
depends = ["check:frontend", "check:backend"]

[tasks."check:backend"]
description = "Run backend checks (rustfmt, clippy)"
depends = ["ensure:dist"]
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --all-features -- -D warnings"]
dir = "packages/backend"

[tasks."check:frontend"]
description = "Run frontend checks (typecheck, lint, format)"
depends = ["gen:sdk"]
run = "pnpm run check"
dir = "packages/frontend"

[tasks.fix]
description = "Auto-fix in each stack"
depends = ["fix:backend", "fix:frontend"]

[tasks."fix:backend"]
description = "Auto-fix backend formatting"
run = "cargo fmt --all"
dir = "packages/backend"

[tasks."fix:frontend"]
description = "Auto-fix frontend lint and formatting"
depends = ["install:frontend"]
run = "pnpm run fix"
dir = "packages/frontend"

# Unit and integration tests: the backend's (cargo) and the frontend's
# (Vitest). The end-to-end smoke tests are `test:e2e`.
[tasks.test]
description = "Run each stack's tests"
depends = ["test:backend", "test:frontend"]

[tasks."test:backend"]
description = "Run the backend tests"
depends = ["ensure:dist"]
run = "cargo test --workspace"
sources = ["src/**/*", "api/**/*", "**/Cargo.toml", "Cargo.lock"]
dir = "packages/backend"

[tasks."test:frontend"]
description = "Run the frontend tests"
depends = ["gen:sdk"]
run = "pnpm run test"
dir = "packages/frontend"

# The end-to-end smoke tests (packages/e2e, Playwright): a real browser
# against the image just built, on a fresh database (scripts/e2e.sh).
[tasks."test:e2e"]
description = "Build the image, start it with a fresh database in a volume, and run the Playwright smoke tests"
depends = ["build:docker", "install:frontend"]
run = [
  "pnpm --filter potoo-e2e exec playwright install chromium",
  "scripts/e2e.sh",
]

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

# Known vulnerabilities in the locked dependencies (the OSV database, which
# has the RustSec and GitHub advisories). Every day in CI (security.yml), as
# new advisories come out for dependencies that did not change. A finding
# to accept goes in osv-scanner.toml, with the reason.
[tasks.audit]
description = "Known vulnerabilities in the locked crates and npm packages (osv-scanner: OSV, RustSec and GitHub advisories)"
run = "osv-scanner scan source --config osv-scanner.toml --lockfile packages/backend/Cargo.lock --lockfile pnpm-lock.yaml"

# Known vulnerabilities in an image (its Alpine packages): the fixable HIGH
# and CRITICAL ones fail. IMAGE picks it, by default the published one; CI
# scans the one it builds. The binary is static, so this is about the base.
[tasks."audit:image"]
description = "Known vulnerabilities in an image's Alpine packages (Trivy): fixable HIGH and CRITICAL ones fail; IMAGE picks it, by default the published one"
run = 'trivy image --skip-version-check --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE:-ghcr.io/lmxrd/potoo:latest}"'

# ---------------------------------------------------------------------------
# Data and manual tooling
# ---------------------------------------------------------------------------

# Write load against the production image in a 2 CPU, 2 GB container; see
# scripts/loadtest.sh for the settings (CPUS, MEMORY, RATES, DURATION).
[tasks.loadtest]
description = "Write load against the production image in a 2 CPU, 2 GB container"
run = "scripts/loadtest.sh"

# A year of demo data for development. Wipes every hit — not the sites
# or users — and creates the demo site blog.example.com when there is
# none. Deterministic: seeding twice gives the same data.
[tasks.seed]
description = "Fill the dev database with a year of demo data (wipes every hit)"
depends = ["ensure:dist"]
run = "cargo run --package api --bin seed"
dir = "packages/backend"

# Remove everything that is generated or local: the Rust build (and the
# OpenAPI spec in it), node_modules, the frontend build and the generated SDK,
# and the local data (the SQLite database and the GeoIP database).
# `mise run install:frontend` and a build bring it all back.
[tasks.clean]
description = "Remove everything generated or local (builds, node_modules, the SDK, the local data)"
run = """
rm -rf packages/backend/target packages/backend/data data dist
rm -rf node_modules packages/*/node_modules packages/frontend/dist packages/sdk/src
rm -f packages/sdk/openapi-ts-error-*.log
"""
