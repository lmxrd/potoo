[tools]
pnpm = "latest"
rust = "latest"

# Development: the Rust backend on :8000 (with the Vite proxy in front of
# the frontend for /api), or the frontend dev server alone.
[tasks.dev]
depends = ["dev:backend", "dev:frontend"]

[tasks."dev:backend"]
run = "cargo run --manifest-path backend/Cargo.toml"

[tasks."dev:frontend"]
run = "pnpm run -C frontend dev"

# Run the compiled backend against a built frontend.
[tasks.start]
run = "cargo run --release --manifest-path backend/Cargo.toml"

[tasks.build]
depends = ["build:frontend", "build:backend"]

[tasks."build:frontend"]
run = "pnpm install -C frontend && pnpm run -C frontend build"

[tasks."build:backend"]
run = "cargo build --release --manifest-path backend/Cargo.toml"
depends = ["build:frontend"]

[tasks."build:docker"]
run = "docker build -t potoo ."

[tasks.check]
depends = ["check:frontend", "check:backend"]

[tasks."check:backend"]
run = "cargo fmt --manifest-path backend/Cargo.toml --check && cargo clippy --manifest-path backend/Cargo.toml -- -D warnings"

[tasks."check:frontend"]
run = "pnpm run -C frontend check"

[tasks.fix]
depends = ["fix:backend", "fix:frontend"]

[tasks."fix:backend"]
run = "cargo fmt --manifest-path backend/Cargo.toml"

[tasks."fix:frontend"]
run = "pnpm run -C frontend fix"

[tasks.test]
run = "cargo test --manifest-path backend/Cargo.toml"
