# Node and pnpm match the Docker image (node:24, and the pnpm of
# frontend/package.json's packageManager): change them together.
[tools]
node = "24"
pnpm = "12.11.2"
# The host target comes with the toolchain; the release also builds the
# static musl binary, so its std is installed for either architecture.
rust = {
  version = "1.99.0",
  components = ["clippy", "llvm-tools", "rustfmt"],
  targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"],
}

# Development: the Rust backend on :8000 (with the Vite proxy in front of
# the frontend for /api), or the frontend dev server alone.
[tasks.dev]
depends = ["dev:backend", "dev:frontend"]

# The backend needs frontend/dist to exist to compile, even in debug.
[tasks."dev:backend"]
depends = ["build:frontend"]
run = "cargo run"
dir = "{{ config_root }}/backend"

# Tasks with sources and outputs are skipped when the outputs are newer
# than the sources.
#
# The frontend's dependencies. Every frontend task depends on this, so a
# fresh checkout (CI included) works; pnpm installs frozen when CI is set.
[tasks."install:frontend"]
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]
dir = "{{ config_root }}/frontend"

# The OpenAPI spec, written by the backend without the frontend embedded
# (--features spec): the frontend's API client is generated from it, so the
# spec comes first. The frontend tasks below depend on it.
[tasks."gen:spec"]
run = "cargo run --features spec --bin openapi"
sources = [
  "src/**/*",
  "migrations/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "build.rs",
]
outputs = ["target/specs/openapi.json"]
dir = "{{ config_root }}/backend"

# The frontend's API client, generated from the spec (not committed). One
# task, so that tasks running side by side never generate it twice at once.
[tasks."gen:client"]
depends = ["install:frontend", "gen:spec"]
run = "pnpm run gen:api"
sources = [
  "../backend/target/specs/openapi.json",
  "openapi-ts.config.ts",
]
dir = "{{ config_root }}/frontend"

[tasks."dev:frontend"]
depends = ["install:frontend", "gen:client"]
run = "pnpm run dev"
dir = "{{ config_root }}/frontend"

# Run the server against a built frontend. Depends on the build so a
# stale binary can never serve yesterday's code.
[tasks.start]
depends = ["build:backend"]
run = "cargo run --release"
dir = "{{ config_root }}/backend"

[tasks.build]
depends = ["build:backend"]

[tasks."build:frontend"]
depends = ["install:frontend", "gen:client"]
run = "pnpm run build"
sources = [
  "src/**/*",
  "index.html",
  "vite.config.ts",
  "tsconfig.json",
  "package.json",
  "pnpm-lock.yaml",
]
dir = "{{ config_root }}/frontend"

[tasks."build:backend"]
depends = ["build:frontend"]
run = "cargo build --release"
sources = [
  "src/**/*",
  "migrations/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "build.rs",
  "../frontend/dist/**/*",
]
outputs = ["target/release/potoo"]
dir = "{{ config_root }}/backend"

[tasks."build:docker"]
run = "podman build -t potoo ."

# The image with a CPU profiler: stop the container (SIGTERM) and the
# flamegraph is written to /data/flamegraph.svg. Never push this one.
[tasks."build:profiling"]
run = "podman build --build-arg PROFILE=profiling --build-arg FEATURES=profiling -t potoo:profiling ."

[tasks.check]
depends = ["check:frontend", "check:backend"]

# rust-embed needs frontend/dist to exist to compile, hence the build.
[tasks."check:backend"]
depends = ["build:frontend"]
run = """
cargo fmt --check \
  && cargo clippy -- -D warnings \
  && cargo clippy --features spec --all-targets -- -D warnings
"""
dir = "{{ config_root }}/backend"

[tasks."check:frontend"]
depends = ["install:frontend", "gen:client"]
run = "pnpm run check"
dir = "{{ config_root }}/frontend"

[tasks.fix]
depends = ["fix:backend", "fix:frontend"]

[tasks."fix:backend"]
run = "cargo fmt"
dir = "{{ config_root }}/backend"

[tasks."fix:frontend"]
depends = ["install:frontend"]
run = "pnpm run fix"
dir = "{{ config_root }}/frontend"

[tasks.test]
depends = ["build:frontend"]
run = "cargo test"
sources = ["src/**/*", "tests/**/*", "migrations/**/*", "Cargo.toml", "Cargo.lock"]
dir = "{{ config_root }}/backend"

# Write load against the production image in a 2 CPU, 2 GB container; see
# scripts/loadtest.sh for the settings (CPUS, MEMORY, RATES, DURATION).
[tasks.loadtest]
run = "scripts/loadtest.sh"

# A year of demo data for development. Wipes every hit — not the sites
# or users — and creates the demo site blog.example.com when there is
# none. Deterministic: seeding twice gives the same data.
[tasks.seed]
depends = ["build:frontend"]
run = "cargo run --bin seed"
dir = "{{ config_root }}/backend"

# Remove everything that is generated or local: the Rust build (and the
# OpenAPI spec in it), node_modules, the frontend build and the generated API
# client, and the local data (the SQLite database and the GeoIP database).
# `mise run install:frontend` and a build bring it all back.
[tasks.clean]
dir = "{{ config_root }}"
run = """
rm -rf backend/target backend/data data
rm -rf frontend/node_modules frontend/dist frontend/src/client
rm -f frontend/openapi-ts-error-*.log
"""
