[tools]
pnpm = "latest"
# The targets the release workflow builds, plus the native one; mise
# installs their std alongside the toolchain, in CI and locally.
rust = {
  version = "1.99.0",
  components = ["clippy", "llvm-tools", "rustfmt"],
  targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
  ],
}

# Development: the Rust backend on :8000 (with the Vite proxy in front of
# the frontend for /api), or the frontend dev server alone.
[tasks.dev]
depends = ["dev:backend", "dev:frontend"]

[tasks."dev:backend"]
run = "cargo run --manifest-path backend/Cargo.toml"

[tasks."dev:frontend"]
run = "pnpm run -C frontend dev"

# Run the server against a built frontend. Depends on the build so a
# stale binary can never serve yesterday's code.
[tasks.start]
depends = ["build:backend"]
run = "cargo run --release --manifest-path backend/Cargo.toml"

[tasks.build]
depends = ["build:frontend", "build:backend"]

[tasks."build:frontend"]
run = "pnpm install -C frontend && pnpm run -C frontend build"

[tasks."build:backend"]
run = "cargo build --release --manifest-path backend/Cargo.toml"
depends = ["build:frontend"]

[tasks."build:docker"]
run = "podman build --platform linux/amd64 -t potoo ."

[tasks.check]
depends = ["check:frontend", "check:backend"]

[tasks."check:backend"]
run = "cargo fmt --manifest-path backend/Cargo.toml --check && cargo clippy --manifest-path backend/Cargo.toml -- -D warnings"

[tasks."check:frontend"]
run = "pnpm run -C frontend check"

[tasks.fix]
depends = ["fix:backend", "fix:frontend"]

[tasks."fix:backend"]
run = "cargo fmt --manifest-path backend/Cargo.toml"

[tasks."fix:frontend"]
run = "pnpm run -C frontend fix"

[tasks.test]
run = "cargo test --manifest-path backend/Cargo.toml"

# A year of demo data for development. Wipes every hit — not the sites
# or users — and creates the demo site blog.example.com when there is
# none. Deterministic: seeding twice gives the same data.
[tasks.seed]
run = "cargo run --manifest-path backend/Cargo.toml --bin seed"

# Remove the local data: the SQLite database and the GeoIP database.
[tasks.clean]
run = "rm -rf data"
