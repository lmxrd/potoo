name: Release

# Publishing a release builds, in parallel and natively on an amd64 and an
# arm64 runner (no cross compiling, no emulation): the Linux binaries,
# attached to the release, and the image, pushed to the GitHub Container
# Registry as one multi-arch manifest. CI never pushes.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # musl binaries are static and run on any Linux, so they get the plain
  # names; the glibc (gnu) builds are suffixed -gnu.
  binaries:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: pnpm install -C frontend --frozen-lockfile && pnpm run -C frontend build
      - name: Build and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for libc in musl gnu; do
            target="$(uname -m)-unknown-linux-$libc"
            cargo build --release --manifest-path backend/Cargo.toml --target "$target"
            cp "backend/target/$target/release/potoo" \
              "dist/potoo-linux-${{ matrix.arch }}$([ $libc = gnu ] && echo -gnu)"
          done
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Each runner pushes its image by digest only; `manifest` tags them.
  image:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # One tag, 1.2.3, 1.2 and latest (prereleases get only the exact
  # version), pointing at both images.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " $(ls digests))
