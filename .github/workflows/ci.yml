name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The quality gates, exactly as locally: the tools come from mise.toml
  # and the checks and tests are the same tasks. The default target on
  # the bare runner — no matrix, no cross compiling — and nothing is
  # pushed: releases publish, CI only verifies. The image is built (the
  # one musl path CI exercises), only tagged, never pushed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run test
      - run: mise run build
      - run: mise run build:docker
