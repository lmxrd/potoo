name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The quality gates, exactly as locally: the tools come from mise.toml
  # and the checks and tests are the same tasks. The default target on
  # the bare runner — no matrix, no cross compiling — and nothing is
  # pushed: releases publish, CI only verifies.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-check-${{ hashFiles('packages/backend/Cargo.lock') }}
      - run: mise run check
      - run: mise run test

  # The builds run in parallel once the checks pass: the release build,
  # and the image. Separate cache keys, since the checks cache a debug
  # target directory and this one a release one.
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('packages/backend/Cargo.lock') }}
      - run: mise run build

  # The image copies the static binary built just before it, with the
  # same task and cargo cache as locally (the Dockerfile builds nothing).
  # Built, never pushed.
  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-linux-${{ hashFiles('packages/backend/Cargo.lock') }}
      - run: mise run build:linux
      - run: docker build -t potoo:ci .
      # Started once, until its own HEALTHCHECK (`potoo healthcheck`) says
      # healthy, so a packaging bug fails the PR, not the release. No GeoIP
      # download.
      - name: Run the image and check its health check
        run: |
          docker run --rm -d --name potoo-ci -e GEOIP_URL= potoo:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' potoo-ci)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs potoo-ci
          exit 1
      # Its Alpine packages: a fixable HIGH or CRITICAL one fails the PR.
      # Trivy's database is cached for the day (security.yml scans the
      # published image every day).
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: mise run audit:image
        env:
          IMAGE: potoo:ci
      # The end-to-end smoke tests (packages/e2e): a real browser against this
      # image, on a fresh database. Only Chromium, cached by Playwright's
      # version (its system libraries are installed every time).
      - run: mise run install:frontend
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' packages/e2e/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter potoo-e2e exec playwright install --with-deps chromium
      - run: scripts/e2e.sh
        env:
          CONTAINER: docker
          IMAGE: potoo:ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: packages/e2e/test-results
