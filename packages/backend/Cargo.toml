[package]
name = "potoo"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[workspace]
resolver = "2"
members = [".", "api"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99.0"

# No unsafe code in any crate of the workspace (each opts in with `[lints] workspace = true`);
# `forbid` cannot be allowed again further in.
[workspace.lints.rust]
unsafe_code = "forbid"

# Dependencies used by more than one crate: versions and shared features live here, a crate adds only
# what it needs on top (`tokio = { workspace = true, features = [..] }`).
[workspace.dependencies]
api = { path = "api" }

# The binaries' errors (main, the seed, the healthcheck), with context.
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = "0.7.1"
tracing = "0.1.44"

# The server binary: the library crate plus the embedded frontend (a module of this binary, so the library and
# the spec generator build without `packages/frontend/dist`).
[dependencies]
api.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
mime_guess = "2.0.5"
# Profiling only, never in a production build (see the profiling feature).
pprof = { version = "0.15.0", optional = true, features = ["flamegraph"] }
rust-embed = "8.13.0"
tokio.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[lints]
workspace = true

[features]
# A CPU profile of the running server: sampled while it runs, written as a
# flamegraph (PROFILE_FLAMEGRAPH=<path>) when it is stopped with SIGINT or
# SIGTERM, and per-phase timers of the hit path printed every 5 seconds.
# Off by default; build with `--features profiling --profile profiling`.
profiling = ["dep:pprof", "api/profiling"]

# Smaller, faster release binaries; the release workflow and the image
# both build with this profile.
[profile.release]
strip = true
lto = true
codegen-units = 1

# A release build that keeps its symbols, so a profile has names in it.
[profile.profiling]
inherits = "release"
strip = false
debug = 1
